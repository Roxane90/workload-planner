<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Boards</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/boards">Workload Planner</a>
    <div>
        <a class="btn btn-outline-light btn-sm" href="/boards">Boards</a>
        <a class="btn btn-outline-light btn-sm ms-2" href="/analytics"
           sec:authorize="hasRole('MANAGER')">Analytics</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger btn-sm ms-2">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <!-- Success message -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Boards</h1>
        <!-- Only show New Board button to manager -->
        <a href="/boards/new" class="btn btn-primary"
           sec:authorize="hasRole('MANAGER')">+ New Board</a>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="board : ${boards}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${board.title}">Board Title</h5>
                    <p class="card-text" th:text="${board.description}">Description</p>
                    <a th:href="@{/tickets/board/{id}(id=${board.id})}"
                       class="btn btn-sm btn-outline-primary">View Tickets</a>

                    <!-- Only show Delete button to MANAGER -->
                    <form th:action="@{/boards/{id}/delete(id=${board.id})}"
                          method="post" class="d-inline"
                          sec:authorize="hasRole('MANAGER')">
                        <button type="submit"
                                class="btn btn-sm btn-outline-danger ms-2">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(boards)}" class="text-muted">
        No boards yet. Create one!
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
