<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Ticket</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/boards">Workload Planner</a>
    <div>
        <a class="btn btn-outline-light btn-sm" href="/boards">Boards</a>
        <a class="btn btn-outline-danger btn-sm ms-2" href="/logout">Logout</a>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">Edit Ticket</h1>

    <form th:action="@{/tickets/{id}/edit(id=${ticket.id})}" method="post">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control"
                   name="title" th:value="${ticket.title}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description"
                      rows="3" th:text="${ticket.description}"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a th:href="@{/tickets/board/{id}(id=${ticket.board.id})}"
           class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>

</body>
</html>
