<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Tickets</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/boards">Workload Planner</a>
    <div>
        <a class="btn btn-outline-light btn-sm" href="/boards">Boards</a>
        <a class="btn btn-outline-light btn-sm ms-2" href="/analytics"
           sec:authorize="hasRole('MANAGER')">Analytics</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger btn-sm ms-2">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Tickets for: <span th:text="${board.title}">Board</span></h1>
        <!-- Only show New Ticket button to MANAGER -->
        <a th:href="@{/tickets/new/{id}(id=${board.id})}"
           class="btn btn-primary"
           sec:authorize="hasRole('MANAGER')">+ New Ticket</a>
    </div>

    <div class="row">

        <!-- TO DO board -->
        <div class="col-md-4">
            <h4 class="text-center bg-secondary text-white p-2 rounded">To Do</h4>
            <div th:each="ticket : ${tickets}" th:if="${ticket.status == 'TODO'}">
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 class="card-title" th:text="${ticket.title}">Ticket</h6>
                        <p class="card-text small" th:text="${ticket.description}"></p>

                        <form th:action="@{/tickets/{id}/status(id=${ticket.id})}"
                              method="post">
                            <select name="status" class="form-select form-select-sm mb-2">
                                <option value="TODO">To Do</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="DONE">Done</option>
                            </select>
                            <button type="submit"
                                    class="btn btn-sm btn-outline-primary">Update</button>
                        </form>

                        <form th:action="@{/tickets/{id}/delete(id=${ticket.id})}"
                              method="post" class="d-inline ms-1"
                              sec:authorize="hasRole('MANAGER')">
                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>

                        <!-- Edit button -->
                        <a th:href="@{/tickets/{id}/edit(id=${ticket.id})}"
                           class="btn btn-sm btn-outline-warning ms-1"
                           sec:authorize="hasRole('MANAGER')">Edit</a>

                        <!-- Assign Me button -->
                        <form th:action="@{/tickets/{id}/assign(id=${ticket.id})}"
                              method="post" class="mt-2">
                            <button type="submit" class="btn btn-sm btn-outline-success">
                                Assign Me
                            </button>
                        </form>

                        <!-- Show who is assigned -->
                        <div class="mt-2">
                            <small class="text-muted">Assigned to:</small><br>
                            <div th:each="assignment : ${assignments}">

        <span th:if="${assignment.ticket.id == ticket.id}"
              class="badge bg-secondary me-1"
              th:text="${assignment.user.username}">username</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- IN PROGRESS board -->
        <div class="col-md-4">
            <h4 class="text-center bg-primary text-white p-2 rounded">In Progress</h4>
            <div th:each="ticket : ${tickets}" th:if="${ticket.status == 'IN_PROGRESS'}">
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 class="card-title" th:text="${ticket.title}">Ticket</h6>
                        <p class="card-text small" th:text="${ticket.description}"></p>

                        <form th:action="@{/tickets/{id}/status(id=${ticket.id})}"
                              method="post">
                            <select name="status" class="form-select form-select-sm mb-2">
                                <option value="TODO">To Do</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="DONE">Done</option>
                            </select>
                            <button type="submit"
                                    class="btn btn-sm btn-outline-primary">Update</button>
                        </form>

                        <form th:action="@{/tickets/{id}/delete(id=${ticket.id})}"
                              method="post" class="d-inline ms-1"
                              sec:authorize="hasRole('MANAGER')">
                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>

                        <!-- Edit button -->
                        <a th:href="@{/tickets/{id}/edit(id=${ticket.id})}"
                           class="btn btn-sm btn-outline-warning ms-1"
                           sec:authorize="hasRole('MANAGER')">Edit</a>

                        <!-- Assign Me button -->
                        <form th:action="@{/tickets/{id}/assign(id=${ticket.id})}"
                              method="post" class="mt-2">
                            <button type="submit" class="btn btn-sm btn-outline-success">
                                Assign Me
                            </button>
                        </form>

                        <!-- Show who is assigned -->
                        <div class="mt-2">
                            <small class="text-muted">Assigned to:</small><br>
                            <div th:each="assignment : ${assignments}">

        <span th:if="${assignment.ticket.id == ticket.id}"
              class="badge bg-secondary me-1"
              th:text="${assignment.user.username}">username</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- DONE board -->
        <div class="col-md-4">
            <h4 class="text-center bg-success text-white p-2 rounded">Done</h4>
            <div th:each="ticket : ${tickets}" th:if="${ticket.status == 'DONE'}">
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 class="card-title" th:text="${ticket.title}">Ticket</h6>
                        <p class="card-text small" th:text="${ticket.description}"></p>

                        <form th:action="@{/tickets/{id}/status(id=${ticket.id})}"
                              method="post">
                            <select name="status" class="form-select form-select-sm mb-2">
                                <option value="TODO">To Do</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="DONE">Done</option>
                            </select>
                            <button type="submit"
                                    class="btn btn-sm btn-outline-primary">Update</button>
                        </form>
                        <form th:action="@{/tickets/{id}/delete(id=${ticket.id})}"
                              method="post" class="d-inline ms-1"
                              sec:authorize="hasRole('MANAGER')">
                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>

                        <!-- Edit button -->
                        <a th:href="@{/tickets/{id}/edit(id=${ticket.id})}"
                           class="btn btn-sm btn-outline-warning ms-1"
                           sec:authorize="hasRole('MANAGER')">Edit</a>

                        <!-- Assign Me button -->
                        <form th:action="@{/tickets/{id}/assign(id=${ticket.id})}"
                              method="post" class="mt-2">
                            <button type="submit" class="btn btn-sm btn-outline-success">
                                Assign Me
                            </button>
                        </form>

                        <!-- Show who is assigned -->
                        <div class="mt-2">
                            <small class="text-muted">Assigned to:</small><br>
                            <div th:each="assignment : ${assignments}">
        <span th:if="${assignment.ticket.id == ticket.id}"
              class="badge bg-secondary me-1"
              th:text="${assignment.user.username}">username</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
