<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Edit Ticket</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/boards">Workload Planner</a>
    <div>
        <a class="btn btn-outline-light btn-sm" href="/boards">Home</a>
        <a class="btn btn-outline-light btn-sm ms-2" href="/analytics"
           sec:authorize="hasRole('MANAGER')">Analytics</a>
        <a class="btn btn-outline-light btn-sm ms-2" href="/profile">My Profile</a>
        <span class="text-light me-3 ms-3 small">
            Logged in as <strong th:text="${displayName}">username</strong>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger btn-sm ms-2">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">Edit Ticket</h1>

    <form th:action="@{/tickets/{id}/edit(id=${ticket.id})}" method="post">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control"
                   name="title" th:value="${ticket.title}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description"
                      rows="3" th:text="${ticket.description}"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Story Points (difficulty)</label>
            <select class="form-select" name="storyPoints">
                <option value="" th:selected="${ticket.storyPoints == null}">No story points assigned</option>
                <option value="1" th:selected="${ticket.storyPoints == 1}">1 - Very Easy</option>
                <option value="2" th:selected="${ticket.storyPoints == 2}">2 - Easy</option>
                <option value="3" th:selected="${ticket.storyPoints == 3}">3 - Medium</option>
                <option value="5" th:selected="${ticket.storyPoints == 5}">5 - Hard</option>
                <option value="8" th:selected="${ticket.storyPoints == 8}">8 - Very Hard</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a th:href="@{/tickets/board/{id}(id=${ticket.board.id})}"
           class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>

</body>
</html>
