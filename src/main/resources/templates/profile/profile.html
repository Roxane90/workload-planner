<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/boards">Workload Planner</a>
    <div>
        <a class="btn btn-outline-light btn-sm" href="/boards">Home</a>
        <a class="btn btn-outline-light btn-sm ms-2" href="/analytics"
           sec:authorize="hasRole('MANAGER')">Analytics</a>
        <span class="text-light me-3 ms-3 small">
            Logged in as: <strong sec:authentication="name">username</strong>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit"
                    class="btn btn-outline-danger btn-sm ms-2">Logout</button>
        </form>
    </div>
</nav>

<div class="container" style="max-width: 600px;">

    <h1 class="mb-4">My Profile</h1>

    <!-- Success message -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Error message -->
    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Role badge - non editable -->
    <div class="mb-4">
        <label class="form-label text-muted">Role</label><br>
        <span th:if="${user.role == 'MANAGER'}"
              class="badge bg-danger fs-6">Manager</span>
        <span th:if="${user.role == 'MEMBER'}"
              class="badge bg-primary fs-6">Member</span>
    </div>

    <!-- Profile info form -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">Personal Information</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/profile/update}" method="post">
                <div class="mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control"
                           name="firstName" th:value="${user.firstName}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control"
                           name="lastName" th:value="${user.lastName}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control"
                           name="newUsername" th:value="${user.username}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Job Description</label>
                    <textarea class="form-control" name="jobDescription"
                              rows="2" th:text="${user.jobDescription}"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Change password form -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">Change Password</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/profile/password}" method="post">
                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input type="password" class="form-control"
                           name="currentPassword" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control"
                           name="newPassword" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control"
                           name="confirmPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Update Password</button>
            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
