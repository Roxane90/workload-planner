<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/boards">Workload Planner</a>
    <div>
        <a class="btn btn-outline-light btn-sm" href="/boards">Home</a>
        <a class="btn btn-outline-light btn-sm ms-2" href="/analytics"
           sec:authorize="hasRole('MANAGER')">Analytics</a>
        <a class="btn btn-outline-light btn-sm ms-2" href="/profile">My Profile</a>
        <span class="text-light me-3 ms-3 small">
            Logged in as <strong th:text="${displayName}">username</strong>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger btn-sm ms-2">Logout</button>
        </form>
    </div>
</nav>

<div class="container text-center mt-5">
    <h1 class="display-1 text-danger" th:text="${status}">Error</h1>
    <h3 class="mb-3" th:text="${error}">Something went wrong</h3>
    <p class="text-muted" th:text="${message}">An unexpected error occurred.</p>
    <a href="/boards" class="btn btn-primary mt-3">Go back to Boards</a>
</div>

</body>
</html>
